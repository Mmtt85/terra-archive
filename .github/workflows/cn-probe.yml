# 임시 프로브 — GitHub 러너에서 중섭(비리비리) API에 닿는지 확인용. 확인 후 이 파일은 제거한다.
# 결과는 잡 성패로 표현한다 (공개 API로 결론만 읽으면 되도록): 도달 가능=성공, 차단=실패.
name: cn-probe
on:
  push:
    paths: [".github/workflows/cn-probe.yml"]
  workflow_dispatch:
jobs:
  bilibili:
    runs-on: ubuntu-latest
    steps:
      - run: |
          code=$(curl -s -o /tmp/o -w "%{http_code}" -m 20 -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126.0 Safari/537.36" -H "Referer: https://live.bilibili.com/5555734" "https://api.live.bilibili.com/room/v1/Room/get_info?room_id=5555734")
          echo "status=$code"; head -c 300 /tmp/o
          grep -q '"code":0' /tmp/o
