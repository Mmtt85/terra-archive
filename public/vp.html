<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>뷰포트 진단 — 테라 아카이브</title>
<!--
  실기기(아이폰) 전용 진단 페이지 — 스크린샷 **한 장**으로 원인을 가르기 위한 것.
  에뮬레이터에는 브라우저 툴바가 없어 "셸 바닥이 화면 밖으로 밀리는" 조건이 재현되지 않는다.

  사이트 셸(main.site-main)과 같은 구조를 최소한으로 흉내낸다:
    body{overflow:hidden} · main{height:100svh; flex column} · 안쪽 스크롤러 · sticky 푸터.
  바닥에 띠 세 개:
    띠 A(어두움) = 스크롤러 **안**의 sticky 푸터 (실제 사이트와 같은 방식)
    띠 B(붉음)   = 스크롤러 **밖**의 형제 (셸 높이만 맞으면 무조건 보여야 한다)
    띠 C(파랑)   = 스크롤러 안, 흐름 끝(sticky 아님) — 그 위 여유 120px.
                   끝까지 밀어 손을 뗀 뒤에도 C 가 보이면 "끝에 여유를 두는" 해법이 통한다.
  패널은 브라우저 정체(UA — 사파리/크롬/인앱), 뷰포트 숫자 4종, 안전영역 4변, 확대 배율,
  스크롤 최고점 대비 멈춘 지점(튕김 양), 가로 이동 여부를 실시간으로 보여 준다.
-->
<style>
  html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; }
  body { font: 13px/1.5 -apple-system, system-ui, sans-serif; background: #f1f0eb; color: #242b2f; }
  main { height: 100svh; display: flex; flex-direction: column; }
  header { flex: 0 0 auto; height: 44px; background: #242b2f; color: #c3d24b;
    display: flex; align-items: center; padding: 0 14px; font-weight: 700; font-size: 13px; }
  .scroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden;
    display: flex; flex-direction: column; overscroll-behavior-y: contain; }
  .scroll > * { flex-shrink: 0; }
  .filler { padding: 10px 14px 0; }
  .filler p { margin: 0 0 46px; color: #646c71; }
  .slack { height: 120px; background: repeating-linear-gradient(135deg, #e4e2da 0 8px, #f1f0eb 8px 16px); }
  footer.sticky { position: sticky; bottom: 0; height: 32px;
    background: #171b1d; color: #9fe07f; display: flex; align-items: center;
    justify-content: center; font-weight: 800; letter-spacing: .02em; }
  .flow { height: 32px; background: #1b3f7a; color: #fff; display: flex; align-items: center;
    justify-content: center; font-weight: 800; }
  .sibling { flex: 0 0 auto; height: 32px; background: #7a1b1b; color: #fff;
    display: flex; align-items: center; justify-content: center; font-weight: 800; }
  #panel { position: fixed; left: 6px; right: 6px; top: 50px; z-index: 9;
    background: #fffffff2; border: 1px solid #85827a; border-radius: 10px; padding: 7px 9px; }
  #out { margin: 0; font: 10.5px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; word-break: break-all; }
  #btns { display: flex; gap: 5px; margin-bottom: 6px; flex-wrap: wrap; }
  #btns button { flex: 1 1 auto; padding: 6px 4px; font: 700 11px system-ui; cursor: pointer;
    border: 1px solid #85827a; border-radius: 6px; background: #fbfbf8; color: #242b2f; }
  #btns button.on { background: #242b2f; color: #c3d24b; border-color: #242b2f; }
  .ok { color: #1d7a3a; font-weight: 700; } .bad { color: #b3261e; font-weight: 700; }
</style>
</head>
<body>
<main id="shell">
  <header>진단 — 맨 아래 띠 A·B·C 중 무엇이 보이나요?</header>
  <div class="scroll" id="sc">
    <div class="filler" id="filler"></div>
    <div class="slack" aria-hidden="true"></div>
    <div class="flow" id="bandC">띠 C · 흐름 끝 (여유 120px 위)</div>
    <footer class="sticky" id="bandA">띠 A · 스크롤러 안 (sticky)</footer>
  </div>
  <div class="sibling" id="bandB">띠 B · 스크롤러 밖 (형제)</div>
</main>

<div id="panel">
  <div id="btns">
    <button data-m="svh">100svh</button>
    <button data-m="dvh">100dvh</button>
    <button data-m="vh">100vh</button>
    <button data-m="vv">visualViewport</button>
    <button data-m="reset" title="스크롤 최고점 기록을 지운다">기록 리셋</button>
  </div>
  <pre id="out">…</pre>
</div>

<script>
(function () {
  var shell = document.getElementById("shell");
  var sc = document.getElementById("sc");
  var out = document.getElementById("out");
  var filler = document.getElementById("filler");
  var bandA = document.getElementById("bandA");
  var bandB = document.getElementById("bandB");
  var bandC = document.getElementById("bandC");

  for (var i = 0; i < 18; i++) {
    var p = document.createElement("p");
    p.textContent = "채움 " + (i + 1) + " — 아래로 끝까지 밀어 보세요. 옆으로도 끌어 보세요.";
    filler.appendChild(p);
  }

  // 단위·안전영역 실값을 재기 위한 0폭 프로브들 (fixed 라 흐름에 영향 없음)
  function probe(css) { var d = document.createElement("div"); d.style.cssText = "position:fixed;left:0;top:0;width:0;pointer-events:none;visibility:hidden;" + css; document.body.appendChild(d); return d; }
  var pSvh = probe("height:100svh"), pDvh = probe("height:100dvh"), pLvh = probe("height:100lvh"), pVh = probe("height:100vh");
  var pSat = probe("height:env(safe-area-inset-top,0px)"), pSab = probe("height:env(safe-area-inset-bottom,0px)");
  var pSal = probe("height:env(safe-area-inset-left,0px)"), pSar = probe("height:env(safe-area-inset-right,0px)");
  function h(el) { return Math.round(el.getBoundingClientRect().height); }

  var mode = "svh";
  function applyMode() {
    if (mode === "vv" && window.visualViewport) shell.style.height = Math.round(window.visualViewport.height) + "px";
    else if (mode === "dvh") shell.style.height = "100dvh";
    else if (mode === "vh") shell.style.height = "100vh";
    else shell.style.height = "100svh";
    Array.prototype.forEach.call(document.querySelectorAll("#btns button"), function (b) {
      b.className = b.dataset.m === mode ? "on" : "";
    });
    render();
  }
  Array.prototype.forEach.call(document.querySelectorAll("#btns button"), function (b) {
    b.addEventListener("click", function () {
      if (b.dataset.m === "reset") { peak = 0; peakX = 0; docX = 0; vvOff = 0; render(); return; }
      mode = b.dataset.m; applyMode();
    });
  });

  // 스크롤 기록 — 최고점(고무줄 포함)과 멈춘 지점의 차 = 튕겨 되돌아온 양
  var peak = 0, peakX = 0, docX = 0, vvOff = 0;
  sc.addEventListener("scroll", function () {
    if (sc.scrollTop > peak) peak = sc.scrollTop;
    if (Math.abs(sc.scrollLeft) > peakX) peakX = Math.abs(sc.scrollLeft);
    render();
  }, { passive: true });
  window.addEventListener("scroll", function () { if (Math.abs(window.scrollX) > docX) docX = Math.abs(window.scrollX); render(); }, { passive: true });

  function r(el) { var x = el.getBoundingClientRect(); return { t: Math.round(x.top), b: Math.round(x.bottom), h: Math.round(x.height) }; }
  function line(k, v) { return (k + "              ").slice(0, 14) + v + "\n"; }
  function ua() {
    var u = navigator.userAgent, who = [];
    if (/CriOS/.test(u)) who.push("크롬(iOS)");
    if (/FxiOS/.test(u)) who.push("파이어폭스(iOS)");
    if (/EdgiOS/.test(u)) who.push("엣지(iOS)");
    if (/KAKAOTALK/i.test(u)) who.push("카카오톡 인앱");
    if (/Line\//.test(u)) who.push("라인 인앱");
    if (/Instagram|FBAN|FBAV/.test(u)) who.push("인스타/페북 인앱");
    if (/NAVER|DaumApps/i.test(u)) who.push("네이버/다음 인앱");
    if (/Discord/i.test(u)) who.push("디스코드 인앱");
    if (/GSA\//.test(u)) who.push("구글앱 인앱");
    if (!who.length) who.push(/Safari\//.test(u) ? "사파리(추정)" : "정체 불명(인앱 웹뷰?)");
    var os = (u.match(/OS (\d+[_\d]*)/) || [])[1];
    return who.join("+") + (os ? " · iOS " + os.replace(/_/g, ".") : "") + (navigator.standalone ? " · 홈화면앱" : "");
  }

  function render() {
    var vv = window.visualViewport;
    var sh = r(shell), A = r(bandA), B = r(bandB), C = r(bandC), scr = r(sc);
    var vis = vv ? Math.round(vv.height) : window.innerHeight;
    var max = sc.scrollHeight - sc.clientHeight;
    var s = "";
    s += ua() + "\n";
    s += line("innerH/W", window.innerHeight + " / " + window.innerWidth + "   clientH " + document.documentElement.clientHeight);
    s += line("visualVp", vv ? Math.round(vv.height) + " × " + Math.round(vv.width) + "  off " + Math.round(vv.offsetTop) + "," + Math.round(vv.offsetLeft) + "  배율 " + (+vv.scale.toFixed(3)) : "(없음)");
    s += line("svh/dvh/lvh", h(pSvh) + " / " + h(pDvh) + " / " + h(pLvh) + "   vh " + h(pVh) + "   screen " + window.screen.height);
    s += line("safe-area", "상 " + h(pSat) + " · 하 " + h(pSab) + " · 좌 " + h(pSal) + " · 우 " + h(pSar));
    s += line("셸", sh.h + "px  바닥 " + sh.b + "   스크롤러 바닥 " + scr.b);
    s += line("스크롤", Math.round(sc.scrollTop) + " / " + max + "   최고 " + Math.round(peak) + (peak > max ? "  (넘침 +" + Math.round(peak - max) + ")" : ""));
    s += line("가로", "문서 " + document.documentElement.scrollWidth + "/" + document.documentElement.clientWidth + "  스크롤러 " + sc.scrollWidth + "/" + sc.clientWidth + "  이동 문서 " + Math.round(docX) + " 스크롤러 " + Math.round(peakX) + " 시각뷰포트 " + Math.round(vvOff));
    s += line("띠 A sticky", A.t + "~" + A.b + "  " + getComputedStyle(bandA).position);
    s += line("띠 B 형제", B.t + "~" + B.b);
    s += line("띠 C 흐름끝", C.t + "~" + C.b);
    function vis_(x) { return x.b <= vis + 1 && x.t < vis; }
    s += "화면 안(계산) A " + (vis_(A) ? "예" : "아니오") + " · B " + (vis_(B) ? "예" : "아니오") + " · C " + (vis_(C) ? "예" : "아니오");
    s += "   셸 넘침 " + Math.max(0, sh.b - vis) + "px\n";
    s += "→ 눈으로 실제 보이는 띠를 그대로 알려 주세요 (계산과 다를 수 있음).";
    out.textContent = s;
  }

  window.addEventListener("resize", render);
  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", function () { if (mode === "vv") applyMode(); else render(); });
    window.visualViewport.addEventListener("scroll", function () { if (Math.abs(window.visualViewport.offsetLeft) > vvOff) vvOff = Math.abs(window.visualViewport.offsetLeft); render(); });
  }
  applyMode();
  setInterval(render, 400);
})();
</script>
</body>
</html>
